substitutions:
  update_interval: 5s

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description} https://github.com/Janso123/esphome-deye-inverter"
  min_version: "2026.9.0"
  project:
    name: "janso123.deye-inverter"
    version: "0.15.0-rc"
  devices:
    - id: esp_board
      name: ${friendly_name} ESP Board

logger:
  level: WARN

api:
  encryption:
    key: ${api_key}
  on_client_disconnected:
    - delay: ${safe_mode_delay}
    - if:
        condition:
          not: api.connected
        then:
          - logger.log: "Lost connection to HomeAssistant API - Activating safe mode"
          - script.execute: set_safe_modbus_registers

  on_client_connected:
    - logger.log: "Connection to HomeAssistant API restored"

ota:
  - platform: esphome
    id: ota_esphome
    encryption: # reuses the api encryption key

uart:
  id: modbus_uart
  baud_rate: ${baud_rate}
  stop_bits: 1

modbus:
  id: modbus_1
  uart_id: modbus_uart
  turnaround_time: 70ms

modbus_controller:
  - id: ${modbus_controller_id}
    address: ${modbus_inverter_address}
    modbus_id: modbus_1
    setup_priority: -100
    update_interval: ${update_interval}
    offline_skip_updates: 3
