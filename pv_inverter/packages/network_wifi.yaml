wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: ${fallback_password}

captive_portal:

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    device_id: esp_board
    id: esp_wifi_signal
    icon: mdi:wifi
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      device_id: esp_board
      id: esp_ip_address
      icon: mdi:ip-network
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      device_id: esp_board
      id: esp_wifi_ssid
      icon: mdi:access-point
      entity_category: diagnostic
    mac_address:
      name: Mac Address
      device_id: esp_board
      id: esp_mac_address
      icon: mdi:expansion-card
      entity_category: diagnostic
